name: ci

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-22.04
    env:
      SUPPORT_MODEL_PROVIDER: offline
      LANGSMITH_TRACING: 'false'
      LANGCHAIN_TRACING_V2: 'false'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.9'
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install source without resolving dependencies
        run: python -m pip install --no-index --no-build-isolation --no-deps -e '.[dev,openai]'
      - name: Check dependency consistency and style
        run: |
          python -m pip check
          ruff check src tests scripts
          ruff format --check src tests scripts
      - name: Original and Stage 1 tests, with network disabled
        run: python scripts/run_offline.py pytest -q --cov=support_agent --cov-report=term-missing
      - name: Original 11 scenarios, with network disabled
        run: python scripts/run_offline.py scenarios
      - name: Stage 1 task runner, with network disabled
        run: python scripts/run_offline.py tasks
